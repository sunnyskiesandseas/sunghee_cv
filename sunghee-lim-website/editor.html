<header class="top"><div class="wrap"><div class="topline"><div><div class="eyebrow">YOUR WORDS, YOUR WEBSITE</div><h1>웹사이트 내용 편집</h1></div><a class="button" href="index.html">사이트로 돌아가기 ↗</a></div><p class="intro">아래에서 소개, 연구, 논문, 사진과 링크를 직접 수정할 수 있습니다. <strong>‘초안 저장’은 현재 브라우저에만 저장되며 실제 배포 사이트에는 반영되지 않습니다.</strong> 수정본을 미리 본 뒤 파일을 내려받아 반영해 주세요. 이 화면에는 배포 권한이 없으므로 방문자가 원본 사이트를 바꿀 수 없습니다.</p></div></header>
